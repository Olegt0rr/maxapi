name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:
    secrets:
      MAX_BOT_TOKEN:
        required: false
      TEST_CHAT_ID:
        required: false

permissions:
  contents: read

# Отменяем только устаревшие прогоны PR; на push и при вызове из
# publish.yml группа по SHA, чтобы релизные прогоны не вставали в
# очередь друг за другом и не отменяли друг друга.
# Инфикс `-tests-` обязателен: при вызове через `uses:` из
# publish.yml `github.workflow` резолвится в имя ВЫЗЫВАЮЩЕГО workflow,
# и без инфикса все четыре гейта попали бы в одну группу и встали бы
# в очередь друг за другом.
concurrency:
  group: >-
    ${{ github.workflow }}-tests-${{ github.event_name == 'pull_request'
    && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        dependency-resolution: ["lowest-direct", "highest"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies with ${{ matrix.dependency-resolution }} resolution
        env:
          RESOLUTION: ${{ matrix.dependency-resolution }}
        run: |
          # Это библиотека: пользователи ставят её свежей резолюцией,
          # а не нашим uv.lock. Поэтому обе ноги матрицы резолвят
          # зависимости заново при каждом запуске: `highest` через
          # --upgrade берёт самые свежие версии в пределах pyproject.toml
          # и ловит поломку от нового релиза зависимости сразу, а не
          # через неделю в PR Dependabot. Lock-файл фиксирует только
          # инструменты (lint, mypy, docs ставятся с --locked).
          if [ "$RESOLUTION" = "highest" ]; then
            uv sync --all-groups --resolution highest --upgrade
          else
            uv sync --all-groups --resolution "$RESOLUTION"
          fi

      - name: Run unit tests
        run: |
          uv run pytest tests/ -v -m "not integration" --cov=maxapi --cov-report=xml --cov-report=term

      - name: Run integration tests
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
        run: |
          if [ -n "$MAX_BOT_TOKEN" ]; then
            uv run pytest tests/ -v -m integration
          else
            echo "MAX_BOT_TOKEN не установлен, пропускаем интеграционные тесты"
          fi

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          flags: unittests
          name: codecov-umbrella
