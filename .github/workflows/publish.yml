name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
  workflow_dispatch:

# Дефолт для check-version и вызываемых гейтов; job `publish` ниже
# переопределяет его своим блоком permissions.
# Вызываемые workflow не могут запросить больше прав, чем задано тут.
permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.changed.outputs.changed }}
      should_release: >-
        ${{ github.ref == 'refs/heads/main'
        && (steps.changed.outputs.changed == 'true'
        || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Нужна полная история для сравнения

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get current version
        id: version
        run: |
          python -c "import tomllib; f = open('pyproject.toml', 'rb'); data = tomllib.load(f); print(data['project']['version'])" > /tmp/current_version.txt
          VERSION=$(cat /tmp/current_version.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if version changed
        id: changed
        run: |
          CURRENT_VERSION=$(cat /tmp/current_version.txt)

          # Получаем версию из предыдущего коммита
          PREVIOUS_VERSION=$(git show HEAD~1:pyproject.toml 2>/dev/null | python -c "import sys, tomllib; data = tomllib.load(sys.stdin.buffer); print(data['project']['version'])" 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_VERSION" ]; then
            # Если нет предыдущей версии, проверяем изменения в файле
            if git diff --quiet HEAD~1 HEAD -- pyproject.toml 2>/dev/null; then
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "No changes in pyproject.toml"
            else
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "pyproject.toml changed (first publish or version file modified)"
            fi
          elif [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version not changed: $CURRENT_VERSION"
          fi

  # Гейты вызываются отсюда, а не отдельными workflow: проверки идут на
  # публикуемом SHA и в одной цепочке `needs` с publish. Дефолтная
  # семантика `needs` (без `always()`) не даст publish стартовать, если
  # любой гейт упал или был пропущен. Единое условие `should_release`
  # не гоняет матрицу тестов на push в main без смены версии и разрешает
  # ручной запуск только с main (иначе publish с любой ветки).
  lint:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    uses: ./.github/workflows/lint.yml

  mypy:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    uses: ./.github/workflows/mypy.yml

  # Секреты — явно, не `secrets: inherit`: только то, что нужно тестам.
  tests:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    uses: ./.github/workflows/tests.yml
    secrets:
      MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
      TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}

  publish:
    needs: [check-version, lint, mypy, tests]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Для создания GitHub Release
      id-token: write  # Для Trusted Publishing на PyPI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          uv sync --all-groups

      - name: Build package
        run: |
          uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

      - name: Create and push git tag
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          TAG="v$VERSION"

          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG$"; then
            echo "Tag $TAG already exists on origin, skipping tag creation and push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: dist/*
