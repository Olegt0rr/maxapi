name: Type check with mypy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Отменяем только устаревшие прогоны PR; на push и при вызове из
# publish.yml группа по SHA, чтобы релизные прогоны не вставали в
# очередь друг за другом и не отменяли друг друга.
# Инфикс `-mypy-` обязателен: при вызове через `uses:` из
# publish.yml `github.workflow` резолвится в имя ВЫЗЫВАЮЩЕГО workflow,
# и без инфикса все четыре гейта попали бы в одну группу и встали бы
# в очередь друг за другом.
concurrency:
  group: >-
    ${{ github.workflow }}-mypy-${{ github.event_name == 'pull_request'
    && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync --all-groups --locked

      - name: Run mypy
        run: |
          uv run mypy maxapi
